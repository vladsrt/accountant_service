services:
  db:
    image: postgres:17-alpine
    container_name: accountant_db
    restart: always
    environment:
      POSTGRES_USER: ksef_user
      POSTGRES_PASSWORD: ksef_password
      POSTGRES_DB: ksef_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: